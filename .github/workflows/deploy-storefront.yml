name: Deploy Storefront

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "storefront/**"
      - ".github/workflows/deploy-storefront.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: storefront/package-lock.json

      - name: Install dependencies
        working-directory: storefront
        run: |
          npm install -g npm@11
          npm ci

      - name: Build
        working-directory: storefront
        env:
          NUXT_PUBLIC_API_BASE: ${{ secrets.NUXT_PUBLIC_API_BASE }}
          NUXT_PUBLIC_SITE_URL: https://apconsulting.id
        run: npm run generate

      - name: Setup SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "ERROR: SSH_PRIVATE_KEY secret is not set in GitHub Secrets!"
            exit 1
          fi
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy to Hostinger
        env:
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ]; then
            echo "ERROR: SSH_HOST or SSH_USER secret is missing in GitHub Secrets!"
            exit 1
          fi
          PORT="${SSH_PORT:-65002}"
          echo "Connecting to $SSH_USER@$SSH_HOST on port $PORT..."
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='api' \
            --exclude='admin' \
            -e "ssh -p $PORT -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            storefront/.output/public/ \
            $SSH_USER@$SSH_HOST:/home/$SSH_USER/domains/apconsulting.id/public_html/
