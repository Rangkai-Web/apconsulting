name: Deploy Storefront

on:
  push:
    branches: [main]
    paths:
      - 'storefront/**'
      - '.github/workflows/deploy-storefront.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: storefront/package-lock.json

      - name: Install dependencies
        working-directory: storefront
        run: |
          npm install -g npm@11
          npm ci

      - name: Build
        working-directory: storefront
        env:
          NUXT_PUBLIC_API_BASE: ${{ secrets.NUXT_PUBLIC_API_BASE }}
          NUXT_PUBLIC_MIDTRANS_CLIENT_KEY: ${{ secrets.NUXT_PUBLIC_MIDTRANS_CLIENT_KEY }}
          NUXT_PUBLIC_MIDTRANS_IS_PRODUCTION: ${{ secrets.NUXT_PUBLIC_MIDTRANS_IS_PRODUCTION }}
        run: npm run generate

      - name: Setup SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy to Hostinger
        env:
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='api' \
            -e "ssh -p $SSH_PORT -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            storefront/.output/public/ \
            $SSH_USER@$SSH_HOST:/home/u309941630/domains/drplant.co.id/public_html/
