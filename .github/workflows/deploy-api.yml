name: Deploy API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/deploy-api.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Hostinger
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            export PATH="/opt/alt/php83/usr/bin:/usr/local/bin:$PATH"
            TARGET_DIR="/home/${{ secrets.SSH_USER }}/domains/pcgmitra.co.id/repo"
            REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
            if [ ! -d "$TARGET_DIR" ]; then
              echo "Repository directory not found. Cloning repository..."
              mkdir -p "/home/${{ secrets.SSH_USER }}/domains/pcgmitra.co.id"
              git clone "$REPO_URL" "$TARGET_DIR"
            fi
            cd "$TARGET_DIR"
            git remote set-url origin "$REPO_URL"
            git pull origin main
            cd api
            if [ ! -f .env ]; then
              echo "Creating .env from .env.example..."
              cp .env.example .env
              php artisan key:generate
            fi
            composer install --no-dev --optimize-autoloader --no-interaction --no-scripts
            php artisan storage:link || true
            php artisan package:discover --ansi
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache




